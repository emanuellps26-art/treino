<style id="lf-estilo">/* Layout: uma coluna estreita para celular. Faixa preta da marca no topo, semanas em grade de 4, treinos em blocos que abrem. */
:root {

}

  }
}
:root[data-theme="dark"] {
  --bg: #0f0d0d; --surface: #1b1818; --ink: #f4f0f0; --ink-2: #aaa2a2; --line: #332e2e; --field: #131111;
  --red: #f0263f; --on-red: #ffffff; --brand-black: #000000; --on-black: #ffffff; --on-black-2: #b9b2b2;
  --ok: #5fd39a; --up: #5fd39a; --down: #ff7a6b; --ok-bg: #12301f; --warn: #f1c05b; --warn-bg: #33270b; color-scheme: dark;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
h1, h2, h3, p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.brand { background: var(--brand-black); color: var(--on-black); border-bottom: 4px solid var(--red); }
.brand-in { max-width: 720px; margin: 0 auto; padding: 18px 16px; display: flex; align-items: center; gap: 14px; }

.t-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 14px; }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 16px; }
